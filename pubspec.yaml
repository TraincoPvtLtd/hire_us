name: hire_us
description: "HireUs is a Sri Lankan marketplace app that connects customers with skilled workers such as plumbers, electricians, carpenters, masons and handymen, for anything from a quick repair to a full construction project. HireUs acts as the agent between clients and independent workers, and an admin approves every provider before they can take jobs. It earns a commission on each job plus a booking fee, and customers can pay in cash or online. There are three apps (residential clients, company clients and service providers). They're built on Firebase for Android and iOS, support Sinhala, English and Tamil, and will launch first in Colombo and Gampaha."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true
